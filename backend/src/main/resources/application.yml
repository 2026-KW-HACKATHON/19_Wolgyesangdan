spring:
  profiles:
    active: local

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1h
  refresh-token-expiration: 14d

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}

# GPS 동네 인증 (#278) — 카카오 로컬 API로 조회한 행정동 코드가 이 값이면 동네 안으로 본다. 기본값은 월계1동
neighborhood:
  region-code: ${NEIGHBORHOOD_REGION_CODE:1135056000}
  max-accuracy-meters: 100

# 회원 앱(5173)·관리자 웹(5174)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# 관리자 웹 로그인 계정 (POST /auth/admin/login). 운영은 application-prod.yml에서 환경변수 필수
admin:
  login-id: ${ADMIN_LOGIN_ID:admin}
  password: ${ADMIN_PASSWORD:1234}

# 비어 있어도(로컬에 AWS 키가 없는 팀원 환경) 서버는 정상 기동하고, 이미지 업로드 URL 발급 API만 503을 응답한다
s3:
  bucket: ${S3_BUCKET:}
  region: ${S3_REGION:}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}

# 배정·승계 스케줄러 (SchedulingConfig). 로컬에서 끄려면 .env에 SCHEDULING_ENABLED=false
scheduling:
  enabled: ${SCHEDULING_ENABLED:true}

# 헬스 체크(GET /actuator/health)만 공개. 로드밸런서·배포 확인용이라 DB 상태 등 상세 정보는 숨긴다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

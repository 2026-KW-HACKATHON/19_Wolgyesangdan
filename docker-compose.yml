services:
  db:
    image: mysql:8.0
    container_name: wolgyesangdan-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wolgyesangdan}
      MYSQL_USER: ${DB_USERNAME:-wolgyesangdan}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
